[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "insight-project"
version = "0.1.0"
description = "SQL Server migration foundation for the Insight Project data pipeline."
requires-python = ">=3.11"
dependencies = ["pyodbc>=5.2,<6"]

[project.scripts]
insight-project = "insight_project.__main__:main"

[tool.setuptools.packages.find]
include = ["insight_project*"]

[tool.setuptools.package-data]
insight_project = ["sql/*.sql"]
