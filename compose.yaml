services:
  insightquest:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_ENTRY: ${APP_ENTRY:-dashboard.py}
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
